<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Min-heap: predict the next move</title>
<style>
  /* The explorer below was written for a host page that supplies these names and classes. This page supplies its own. */
  :root {
    color-scheme: light dark;
    --background: light-dark(#fbfbfa, #1c1d1f);
    --foreground: light-dark(#1f2328, #e6e6e3);
    --muted: light-dark(#e4e6e9, #34373b);
    --muted-foreground: light-dark(#5b6168, #a3a8ae);
    --border: light-dark(#c9cdd2, #4a4e53);
    --viz-series-1: light-dark(#2f6fd0, #7fb0ff);
    --font-size-base: 15px;
  }
  body { margin: 0 auto; max-width: 760px; padding: 24px 16px; background: var(--background); color: var(--foreground);
    font: var(--font-size-base)/1.5 system-ui, sans-serif; }
  .btn, .form-select, .form-control { font: inherit; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--background); color: var(--foreground); }
  .btn { cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--foreground); color: var(--background); }
  .viz-controls, .viz-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
  .text-small { font-size: 13px; color: var(--muted-foreground); }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="heap-explorer">
  <style>
    #heap-explorer .heap-heading { padding-right: 96px; }
    #heap-explorer .heap-figure { width: 100%; display: block; overflow: visible; }
    #heap-explorer .heap-figure text { fill: var(--foreground); font-size: var(--font-size-base); }
    #heap-explorer .heap-figure .index { fill: var(--muted-foreground); }
    #heap-explorer .heap-figure .edge { stroke: var(--border); stroke-width: 1.5; }
    #heap-explorer .heap-figure .node { fill: var(--muted); }
    #heap-explorer .heap-figure .active { fill: color-mix(in srgb, var(--viz-series-1) 24%, var(--background)); }
    #heap-explorer .heap-figure .moving { transition: transform 350ms ease; }
    #heap-explorer .heap-status { margin: 12px 0; }
    #heap-explorer .heap-prediction { margin: 12px 0; }
    #heap-explorer [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { #heap-explorer .heap-figure .moving { transition: none; } }
  </style>
  <h3 class="heap-heading">Min-heap: predict the next move</h3>
  <div class="viz-controls">
    <label class="form-label">Operation
      <select class="form-select" id="heap-case">
        <option value="0">Push 2</option>
        <option value="1">Pop minimum</option>
        <option value="2">Push duplicate 3</option>
      </select>
    </label>
  </div>
  <div id="heap-view">
    <svg class="heap-figure" role="img" aria-label="Min-heap as a tree and its zero-based array"></svg>
    <div class="heap-status text-small" id="heap-status" aria-live="polite"></div>
    <div class="heap-prediction">
      <div id="heap-question"></div>
      <div class="viz-row" id="heap-choices"></div>
      <div id="heap-feedback" aria-live="polite"></div>
    </div>
    <div class="viz-row">
      <button class="btn" type="button" id="heap-back">Back</button>
      <button class="btn btn-primary" type="button" id="heap-next">Next step</button>
      <span class="text-small tabular-nums" id="heap-step"></span>
    </div>
  </div>
  <div id="heap-recall" hidden>
    <label class="form-label" for="heap-recall-answer">Without the picture: pop the minimum from [1, 4, 2, 9, 6, 8]. What is the new minimum?</label>
    <div class="viz-controls">
      <input class="form-control" id="heap-recall-answer" inputmode="numeric" autocomplete="off">
      <button class="btn btn-primary" type="button" id="heap-check">Check recall</button>
    </div>
    <div id="heap-recall-feedback" aria-live="polite"></div>
    <button class="btn" type="button" id="heap-return">Return to trace</button>
  </div>
  <script type="application/json" id="heap-data">[{"name": "Push 2", "frames": [{"a": [3, 8, 5, 12, 10, 7], "label": "Initial min-heap", "active": [], "valid": true, "question": "Where does 2 go first?", "choices": ["Next empty position", "Replace the root"], "answer": "Next empty position"}, {"a": [3, 8, 5, 12, 10, 7, 2], "label": "Compare with parent", "active": [6, 2], "valid": false, "question": "2 and parent 5: next move?", "choices": ["Swap with parent", "Stop sifting"], "answer": "Swap with parent"}, {"a": [3, 8, 2, 12, 10, 7, 5], "label": "Compare with parent", "active": [2, 0], "valid": false, "question": "2 and parent 3: next move?", "choices": ["Swap with parent", "Stop sifting"], "answer": "Swap with parent"}, {"a": [2, 8, 3, 12, 10, 7, 5], "label": "Push complete", "active": [], "valid": true, "question": null, "choices": null, "answer": null}]}, {"name": "Pop minimum", "frames": [{"a": [3, 8, 5, 12, 10, 7], "label": "Initial min-heap", "active": [], "valid": true, "question": "Remove 3: which item fills the root?", "choices": ["7", "8"], "answer": "7"}, {"a": [7, 8, 5, 12, 10], "label": "Choose the smaller child", "active": [0, 2], "valid": false, "question": "7 at index 0: next move?", "choices": ["Swap with 8", "Swap with 5", "Stop sifting"], "answer": "Swap with 5"}, {"a": [5, 8, 7, 12, 10], "label": "Pop complete \u00b7 returned 3", "active": [], "valid": true, "question": null, "choices": null, "answer": null}]}, {"name": "Push duplicate 3", "frames": [{"a": [3, 8, 5, 12, 10, 7], "label": "Initial min-heap", "active": [], "valid": true, "question": "Where does 3 go first?", "choices": ["Next empty position", "Replace the root"], "answer": "Next empty position"}, {"a": [3, 8, 5, 12, 10, 7, 3], "label": "Compare with parent", "active": [6, 2], "valid": false, "question": "3 and parent 5: next move?", "choices": ["Swap with parent", "Stop sifting"], "answer": "Swap with parent"}, {"a": [3, 8, 3, 12, 10, 7, 5], "label": "Compare with parent", "active": [2, 0], "valid": true, "question": "3 and parent 3: next move?", "choices": ["Swap with parent", "Stop sifting"], "answer": "Stop sifting"}, {"a": [3, 8, 3, 12, 10, 7, 5], "label": "Push complete", "active": [], "valid": true, "question": null, "choices": null, "answer": null}]}]</script>
  <script>
  (() => {
    const root = document.getElementById('heap-explorer');
    const el = id => root.querySelector('#heap-' + id);
    const cases = JSON.parse(el('data').textContent);
    const svg = root.querySelector('.heap-figure');
    const ns = 'http://www.w3.org/2000/svg';
    let caseIndex = 0, step = 0, answered = false, feedback = '', recall = false;
    let previous = new Map();
    function restore(snapshot) {
      const s = snapshot?.privateContent;
      if (!s || s.version !== 1) return;
      caseIndex = Number.isInteger(s.caseIndex) && cases[s.caseIndex] ? s.caseIndex : 0;
      step = Number.isInteger(s.step) ? Math.max(0, Math.min(s.step, cases[caseIndex].frames.length - 1)) : 0;
      answered = s.answered === true;
      recall = s.recall === true;
      feedback = typeof s.feedback === 'string' ? s.feedback : '';
    }
    function save() {
      if (window.openai?.setWidgetState) window.openai.setWidgetState({
        modelContent: {topic: 'min-heap', operation: cases[caseIndex].name, step: step + 1, feedback, recall},
        privateContent: {version: 1, caseIndex, step, answered, feedback, recall}
      }).catch(() => {});
    }
    function node(tag, attrs, text) {
      const n = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
      if (text !== undefined) n.textContent = text;
      svg.appendChild(n);
      return n;
    }
    function draw() {
      const f = cases[caseIndex].frames[step];
      const w = Math.max(280, root.getBoundingClientRect().width);
      const height = 300;
      svg.setAttribute('viewBox', `0 0 ${w} ${height}`);
      svg.setAttribute('height', height);
      svg.replaceChildren();
      node('title', {}, `${cases[caseIndex].name}: ${f.label}`);
      node('desc', {}, `Array ${f.a.join(', ')}. ${f.valid ? 'Heap order holds.' : 'Heap order is being repaired.'}`);
      const position = i => {
        const level = Math.floor(Math.log2(i + 1));
        return {x: w * (i - (2 ** level - 1) + 0.5) / (2 ** level), y: 30 + level * 67};
      };
      f.a.forEach((v, i) => {
        if (!i) return;
        const p = position(Math.floor((i - 1) / 2)), c = position(i);
        node('line', {x1: p.x, y1: p.y, x2: c.x, y2: c.y, class: 'edge'});
      });
      const seen = {}, nextPositions = new Map();
      f.a.forEach((v, i) => {
        seen[v] = (seen[v] || 0) + 1;
        const key = `${v}:${seen[v]}`;
        const pos = position(i), cell = w / Math.max(7, f.a.length);
        const x = (i + .5) * cell, y = 248;
        const active = f.active.includes(i);
        node('circle', {cx: pos.x, cy: pos.y, r: 20, class: active ? 'node active' : 'node'});
        node('text', {x: pos.x, y: pos.y + 35, 'text-anchor': 'middle', class: 'index'}, i);
        node('rect', {x: x-cell/2+3, y: y-19, width: cell-6, height: 38, rx: 3, class: active ? 'node active' : 'node'});
        node('text', {x, y: 287, 'text-anchor': 'middle', class: 'index'}, i);
        ['tree', 'array'].forEach(view => {
          const target = view === 'tree' ? pos : {x, y};
          const t = node('text', {x: 0, y: 5, 'text-anchor': 'middle', class: 'moving'}, v);
          const old = previous.get(`${key}:${view}`) || target;
          t.style.transform = `translate(${old.x}px, ${old.y}px)`;
          requestAnimationFrame(() => { t.style.transform = `translate(${target.x}px, ${target.y}px)`; });
          nextPositions.set(`${key}:${view}`, target);
        });
      });
      node('text', {x: 0, y: 213}, 'Array · labels below = indices');
      previous = nextPositions;
    }
    function render() {
      const f = cases[caseIndex].frames[step];
      el('case').value = String(caseIndex);
      el('view').hidden = recall;
      el('recall').hidden = !recall;
      el('status').textContent = `${f.label} · ${f.valid ? 'Heap order holds' : 'Repair in progress'}${f.active.length ? ' · shaded nodes: comparison' : ''}`;
      el('question').textContent = f.question || 'Trace complete';
      el('choices').replaceChildren();
      (f.choices || []).forEach(choice => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'btn'; b.textContent = choice;
        b.addEventListener('click', () => {
          answered = choice === f.answer;
          feedback = answered ? `Correct: ${choice}.` : `You chose “${choice}”. Recheck the heap rule and try again.`;
          render(); save();
        });
        el('choices').appendChild(b);
      });
      el('feedback').textContent = feedback;
      el('back').disabled = step === 0;
      el('next').disabled = Boolean(f.question) && !answered;
      el('next').textContent = step === cases[caseIndex].frames.length - 1 ? 'Hide & recall' : 'Next step';
      el('step').textContent = `${step + 1} / ${cases[caseIndex].frames.length}`;
      if (!recall) draw();
    }
    el('case').addEventListener('change', e => {
      caseIndex = Number(e.target.value); step = 0; answered = false; feedback = ''; recall = false; previous.clear(); render(); save();
    });
    el('next').addEventListener('click', () => {
      if (step < cases[caseIndex].frames.length - 1) step++;
      else recall = true;
      answered = false; feedback = ''; render(); save();
    });
    el('back').addEventListener('click', () => {step--; answered = false; feedback = ''; render(); save();});
    el('check').addEventListener('click', () => {
      feedback = el('recall-answer').value.trim() === '2' ? 'Correct: 2. Explain why the root holds the minimum in chat.' : 'Not yet. Which remaining value is smallest?';
      el('recall-feedback').textContent = feedback; save();
    });
    el('return').addEventListener('click', () => {recall = false; render(); save();});
    restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals', e => {if (e.detail?.globals?.widgetState) {restore(e.detail.globals.widgetState); render();}});
    new ResizeObserver(() => {if (!recall) {previous.clear(); draw();}}).observe(root);
    render();
  })();
  </script>
</div>
</body>
</html>
