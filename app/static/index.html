<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Coach · Solve</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
      integrity="sha512-uf06llspW44/LZpHzHT6qBOIVODjWtv4MxCricRxkzvopAlSWnTf6hpZTFxuuZcuNE9CBQhqE0Seu1CoRk84nQ==" crossorigin="anonymous">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="bar">
  <a id="home" href="#/map">Map</a>
  <span id="problem">DSA Coach</span>
  <div id="progress" hidden>
    <nav id="stages" aria-label="Solve stages"></nav>
    <span id="stage-name"></span>
  </div>
  <span class="spacer"></span>
  <span id="rung" hidden></span>
  <span id="timer"></span>
  <button id="block-btn" hidden>Start the next block</button>
  <span id="actions" hidden>
    <button id="ask-btn" class="ghost">Ask coach</button>
    <button id="save-btn" class="ghost" title="Save the code (⌘S)">Save</button>
    <button id="run-btn" class="primary" title="Save, then run the EXAMPLES">Run<span class="unsaved-dot" aria-hidden="true"></span></button>
    <span id="dirty" class="sr-only" role="status"></span>
  </span>
</header>
<div id="banner" role="status" hidden></div>
<div id="rescue" role="alert" hidden></div>
<div id="recovery" role="status" hidden></div>

<main id="start" hidden>
  <div class="start-card">
    <p id="pick-kind" class="eyebrow"></p>
    <h1 id="next-pick"></h1>
    <label>Problem (LeetCode slug) <input id="slug" placeholder="koko-eating-bananas" autocomplete="off" spellcheck="false"></label>
    <div class="row">
      <label>Difficulty
        <select id="difficulty">
          <option value="">as before, or medium</option><option>easy</option><option>medium</option><option>hard</option>
        </select>
      </label>
      <label>Sure you'll solve it unaided?
        <select id="confidence">
          <option value="">choose 1–5</option><option value="1">1, not at all</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5, certain</option>
        </select>
      </label>
    </div>
    <button id="start-btn" class="primary wide" disabled>Start solving</button>
    <details class="more">
      <summary>More options</summary>
      <label>Pattern (only for problems outside the roadmap) <input id="pattern" placeholder="binary-search" autocomplete="off" spellcheck="false"></label>
      <p class="hint">Difficulty sets how long a focus block is.</p>
      <p id="due-line" class="hint"></p>
    </details>
  </div>
</main>

<main id="solve" hidden>
  <section id="left">
    <div class="tabs" role="tablist" aria-label="Problem">
      <button role="tab" id="tab-desc" data-tab="desc" aria-controls="desc">Description</button>
      <button role="tab" id="tab-stage" data-tab="stage" aria-controls="panel">Stage</button>
      <button role="tab" id="tab-notes" data-tab="notes" aria-controls="notes">Notes</button>
    </div>
    <div id="desc" class="pane" role="tabpanel" aria-labelledby="tab-desc" hidden></div>
    <section id="panel" class="pane" role="tabpanel" aria-labelledby="tab-stage"></section>
    <div id="notes" class="pane" role="tabpanel" aria-labelledby="tab-notes" hidden></div>
  </section>
  <section id="work">
    <div id="editor-host"><textarea id="editor-fallback" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Attempt file"></textarea></div>
    <section id="console">
      <div class="tabs console-head" role="tablist" aria-label="Tests">
        <button role="tab" id="tab-cases" data-console="cases" aria-controls="cases">Testcases</button>
        <button role="tab" id="tab-results" data-console="results" aria-controls="results">Result</button>
        <span class="spacer"></span>
        <p id="draft-status" role="status"></p>
        <button id="console-toggle" class="icon" aria-expanded="true" aria-controls="console-body" title="Collapse the console">
          <span aria-hidden="true">▾</span><span class="sr-only">Console</span></button>
      </div>
      <div id="console-body">
        <div id="cases" role="tabpanel" aria-labelledby="tab-cases"></div>
        <div id="results" role="tabpanel" aria-labelledby="tab-results" hidden></div>
      </div>
    </section>
  </section>
</main>
<main id="map"></main>
<main id="learn"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
        integrity="sha512-OeZ4Yrb/W7d2W4rAMOO0HQ9Ro/aWLtpW9BUSR2UOWnSV2hprXLkkYnnCGc9NeLUxxE4ZG7zN16UuT1Elqq8Opg==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"
        integrity="sha512-Vs2GKxnxnTQBRW7o2xXZ9A28njjmu5RToS42efiKNEWmikov0inZY522EtGVK5CcVo0M/FQwmXsTfl9skgRnvw==" crossorigin="anonymous"></script>
<script src="/static/app.js"></script>
<script src="/static/nav.js"></script>
</body>
</html>
