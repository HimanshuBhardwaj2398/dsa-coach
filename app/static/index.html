<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsa-coach-app" content="1">
<title>DSA Coach</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-view="today">
<header>
  <nav aria-label="Views">
    <a href="#/today" data-nav="today">Today</a>
    <a href="#/map" data-nav="map">Map</a>
  </nav>
  <span class="note">Learn here. Solve on LeetCode. Coach in chat.</span>
  <button id="refresh" type="button" class="ghost">Refresh</button>
</header>
<div id="notice" role="status" hidden></div>
<aside id="recovery" hidden aria-label="Earlier practice drafts"></aside>
<main id="content" aria-busy="true"><p class="muted">Loading…</p></main>
<section id="handoff" hidden aria-labelledby="handoff-title">
  <h2 id="handoff-title">Ask your coach</h2>
  <p class="hint">Paste this into your coach chat. When the coach has saved the explainer, choose Refresh.</p>
  <label for="handoff-prompt" class="sr-only">Prompt for the coach</label>
  <textarea id="handoff-prompt" rows="6"></textarea>
  <div class="actions">
    <button id="copy-prompt" type="button" class="primary">Copy prompt</button>
    <button id="close-handoff" type="button" class="ghost">Close</button>
  </div>
  <p id="copy-status" class="hint" role="status"></p>
</section>
<script src="/static/app.js"></script>
<script src="/static/nav.js"></script>
</body>
</html>
