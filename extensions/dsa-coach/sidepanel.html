<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA Coach</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header><strong>DSA Coach</strong><div><a id="full-app" target="_blank" rel="noopener">Full app ↗</a><button id="connection-toggle" aria-label="Connection settings" aria-expanded="false" aria-controls="connection">⚙</button></div></header>
  <details id="connection" hidden>
    <summary>Connection settings</summary>
    <form id="settings">
      <label for="server">Server address</label>
      <input id="server" type="url" required spellcheck="false" placeholder="http://127.0.0.1:8765">
      <button type="submit">Connect</button>
    </form>
    <p>Start the app from your dsa-coach folder:</p>
    <code>python3 app/server.py --no-browser</code>
    <p>Use the address printed in the terminal.</p>
  </details>
  <p id="status" role="status">Connecting to your coach…</p>
  <p id="screen-access" hidden>The coach asked to see LeetCode. <button id="allow-screen">Allow screenshots</button></p>
  <iframe id="coach" title="DSA Coach study workspace" allow="clipboard-write" hidden></iframe>
  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
